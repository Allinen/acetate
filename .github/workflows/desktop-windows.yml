# The desktop client for Windows, built on Linux by clients/desktop/package-windows.sh
# (the same script as locally). The app folder is the run's artifact.
name: Desktop (Windows)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 p7zip-full zip
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop
      - name: Build and pack
        run: clients/desktop/package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Acetate-windows-x86_64
          path: clients/desktop/target/windows/Acetate

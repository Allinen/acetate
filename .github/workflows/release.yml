# A release. Pushing a version tag (v1.2.3) on a commit that's on main builds the desktop
# app for Linux and Windows (clients/desktop/package-*.sh, the same scripts as locally) and
# the Android app, and makes a GitHub release with all three; and builds the server's image
# for amd64 and arm64 and publishes it to ghcr.io/allinen/acetate (tags 1.2.3, 1.2 and
# latest). The tag has to match the version of the server, the core, the desktop app and
# the Android app: the clients ask for the version of the server they talk to.
#
# The Android release is signed with the key in the repository's secrets
# (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD;
# docs/android.md, "Signing a release", says how to make one).
#
# Run by hand ("Run workflow"), it builds them from the branch chosen and keeps them as
# the run's artifacts, without a release (the image is built for amd64 and not published). Without the secrets the APK is signed with the
# debug key, which is fine to try but not to publish.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag is on main
        if: github.ref_type == 'tag'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME isn't on main"; exit 1; }
      - name: The tag is the version of everything (scripts/versions.py)
        run: scripts/versions.py ${{ github.ref_type == 'tag' && format('--tag {0}', github.ref_name) || '' }}

  linux:
    needs: check
    # The oldest glibc the program needs is this system's (2.39).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
          rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients
      - name: Build and pack
        run: clients/desktop/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: clients/target/linux/Acetate-linux-x86_64.tar.gz

  windows:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 p7zip-full zip
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients
      - name: Build and pack
        run: clients/desktop/package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: clients/target/windows/Acetate-windows-x86_64.zip

  android:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          cargo install cargo-ndk --locked
          # The versions build.gradle.kts asks for (ndkVersion, compileSdk).
          ndk=$(sed -n 's/.*ndkVersion = "\(.*\)"/\1/p' clients/android/app/build.gradle.kts)
          sdk=$(sed -n 's/.*compileSdk { version = release(\([0-9]*\)) }/\1/p' clients/android/app/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" "platforms;android-$sdk.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref_type != 'tag' && github.ref != 'refs/heads/main' }}
      - name: The key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            [ "$GITHUB_REF_TYPE" = tag ] && { echo "::error::no signing key in the secrets"; exit 1; }
            echo "::warning::no signing key in the secrets: the APK is signed with the debug key"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ACETATE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        env:
          ACETATE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ACETATE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ACETATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: clients/android
        run: |
          # 1.2.3 -> 10203: the code has to go up with every release, and this does.
          name=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          IFS=. read -r major minor patch <<< "${name%%[-+]*}"
          ./gradlew --no-daemon assembleRelease \
            -Pacetate.versionName="$name" \
            -Pacetate.versionCode=$((major * 10000 + minor * 100 + patch))
      - name: Signed with the release key
        if: github.ref_type == 'tag'
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs clients/android/app/build/outputs/apk/release/app-release.apk)
          echo "$certs"
          ! grep -qi "Android Debug" <<< "$certs" || { echo "::error::signed with the debug key"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: clients/android/app/build/outputs/apk/release/app-release.apk

  # The server's image, one build per architecture on a machine of its own (an arm64 build
  # under emulation takes an hour), then one name for both.
  image:
    needs: check
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The name (lowercase, as the registry wants it)
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - id: build
        uses: docker/build-push-action@v6
        env:
          # No build record kept as an artifact of the run (nothing reads it).
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Acetate: a music library server
            org.opencontainers.image.licenses=GPL-3.0-only
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          # Pushed by digest: the tags go on once both architectures are there.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.ref_type == 'tag' }}
      - name: Digest
        if: github.ref_type == 'tag'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: digests-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  image-tags:
    if: github.ref_type == 'tag'
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The name (lowercase, as the registry wants it)
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: One name for both architectures
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

  release:
    if: github.ref_type == 'tag'
    needs: [linux, windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # (Only these: the run has others too, like the image's digests and the build records
      # docker/build-push-action keeps, which aren't release files.)
      - uses: actions/download-artifact@v4
        with:
          name: linux
      - uses: actions/download-artifact@v4
        with:
          name: windows
      - uses: actions/download-artifact@v4
        with:
          name: android
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          mv Acetate-linux-x86_64.tar.gz "Acetate-$tag-linux-x86_64.tar.gz"
          mv Acetate-windows-x86_64.zip "Acetate-$tag-windows-x86_64.zip"
          mv app-release.apk "Acetate-$tag-android.apk"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Acetate $tag" --generate-notes \
            "Acetate-$tag-linux-x86_64.tar.gz" "Acetate-$tag-windows-x86_64.zip" "Acetate-$tag-android.apk"

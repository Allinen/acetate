# The clients' releases. Pushing a version tag (v1.2.3) on a commit that's on main builds
# the desktop app for Linux and Windows (clients/desktop/package-*.sh, the same scripts as
# locally) and the Android app, and makes a GitHub release with all three. The tag has to
# match the version of the server, the core, the desktop app and the Android app: the
# clients ask for the version of the server they talk to.
#
# The Android release is signed with the key in the repository's secrets
# (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD;
# docs/android.md, "Signing a release", says how to make one).
#
# Run by hand ("Run workflow"), it builds them from the branch chosen and keeps them as
# the run's artifacts, without a release. Without the secrets the APK is signed with the
# debug key, which is fine to try but not to publish.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag is on main and says the app's version
        if: github.ref_type == 'tag'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME isn't on main"; exit 1; }
          for manifest in Cargo.toml clients/core/Cargo.toml clients/desktop/Cargo.toml clients/android/rust/Cargo.toml; do
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' "$manifest" | head -1)
            [ "$GITHUB_REF_NAME" = "v$version" ] \
              || { echo "::error::the tag is $GITHUB_REF_NAME, $manifest says $version"; exit 1; }
          done

  linux:
    needs: check
    # The oldest glibc the program needs is this system's (2.39).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
          rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients
      - name: Build and pack
        run: clients/desktop/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: clients/target/linux/Acetate-linux-x86_64.tar.gz

  windows:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 p7zip-full zip
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients
      - name: Build and pack
        run: clients/desktop/package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: clients/target/windows/Acetate-windows-x86_64.zip

  android:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          cargo install cargo-ndk --locked
          # The versions build.gradle.kts asks for (ndkVersion, compileSdk).
          ndk=$(sed -n 's/.*ndkVersion = "\(.*\)"/\1/p' clients/android/app/build.gradle.kts)
          sdk=$(sed -n 's/.*compileSdk { version = release(\([0-9]*\)) }/\1/p' clients/android/app/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" "platforms;android-$sdk"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref_type != 'tag' && github.ref != 'refs/heads/main' }}
      - name: The key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            [ "$GITHUB_REF_TYPE" = tag ] && { echo "::error::no signing key in the secrets"; exit 1; }
            echo "::warning::no signing key in the secrets: the APK is signed with the debug key"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ACETATE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        env:
          ACETATE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ACETATE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ACETATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: clients/android
        run: |
          # 1.2.3 -> 10203: the code has to go up with every release, and this does.
          name=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          IFS=. read -r major minor patch <<< "${name%%[-+]*}"
          ./gradlew --no-daemon assembleRelease \
            -Pacetate.versionName="$name" \
            -Pacetate.versionCode=$((major * 10000 + minor * 100 + patch))
      - name: Signed with the release key
        if: github.ref_type == 'tag'
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs clients/android/app/build/outputs/apk/release/app-release.apk)
          echo "$certs"
          ! grep -qi "Android Debug" <<< "$certs" || { echo "::error::signed with the debug key"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: clients/android/app/build/outputs/apk/release/app-release.apk

  release:
    if: github.ref_type == 'tag'
    needs: [linux, windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          mv Acetate-linux-x86_64.tar.gz "Acetate-$tag-linux-x86_64.tar.gz"
          mv Acetate-windows-x86_64.zip "Acetate-$tag-windows-x86_64.zip"
          mv app-release.apk "Acetate-$tag-android.apk"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Acetate $tag" --generate-notes \
            "Acetate-$tag-linux-x86_64.tar.gz" "Acetate-$tag-windows-x86_64.zip" "Acetate-$tag-android.apk"

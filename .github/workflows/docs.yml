# The user guide (docs/, an mdBook) as a website: https://allinen.github.io/acetate/
# Published when something in docs/ changes on main; by hand ("Run workflow"), it builds
# the book from the branch chosen, which catches a broken one without publishing.
#
# One-time setup: Settings -> Pages -> Source: GitHub Actions.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: 0.5.4
  # Of the x86_64-unknown-linux-gnu archive of that version (as in the Dockerfile).
  MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: mdBook
        run: |
          curl -sSfL -o "$RUNNER_TEMP/mdbook.tar.gz" "https://github.com/rust-lang/mdBook/releases/download/v$MDBOOK_VERSION/mdbook-v$MDBOOK_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$MDBOOK_SHA256  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/mdbook" --version
      # The book is written into ../target/book (book.toml).
      - run: $RUNNER_TEMP/mdbook build docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/book

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

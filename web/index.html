<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acetate</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <a href="#/" class="logo">Acetate</a>
    <input id="search" type="search" placeholder="Search title or artist…" autocomplete="off">
    <button id="upload-toggle" hidden>Upload</button>
    <a id="shares-link" href="#/shares" hidden>Shares</a>
    <a id="review-link" href="#/review" hidden>Review</a>
    <a id="whoami" href="#/account" title="Account: password and sessions"></a>
    <button id="account" class="small"></button>
  </header>

  <section id="login" hidden>
    <form id="login-form" class="stack">
      <strong>Acetate</strong>
      <label>username <input name="username" autocomplete="username" required autofocus></label>
      <label>password <input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Log in</button>
      <div id="login-error" class="error"></div>
    </form>
  </section>

  <section id="upload-panel" hidden></section>

  <!-- What a share link (/s/<token>) shows to someone who isn't logged in. -->
  <section id="share-view" hidden></section>

  <main>
    <section id="list-pane">
      <table id="track-list">
        <thead>
          <tr><th>Title</th><th>Artist</th><th>Status</th><th>Date</th><th>Codec</th><th>Length</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <button id="load-more" hidden>Load more</button>
    </section>
    <section id="detail-pane">
      <p class="muted">Select a track.</p>
    </section>
  </main>

  <footer id="player">
    <img id="player-cover" alt="" hidden>
    <div id="player-info"><span class="muted">Nothing playing</span></div>
    <audio id="audio" controls preload="none"></audio>
  </footer>

  <script src="/app.js"></script>
</body>
</html>

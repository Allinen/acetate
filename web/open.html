<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acetate</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- A link to a track, album or artist (/open/<kind>/<id>), sent by someone: handed to
       the desktop app if this browser is logged in, else the web UI's page for it. -->
  <main class="open-link">
    <h1>Acetate</h1>
    <p id="status">Opening…</p>
    <p class="row">
      <a id="app-link" class="button" href="#">Open in the Acetate app</a>
      <a id="web-link" class="button" href="/">Open it in the browser</a>
    </p>
    <p id="hint" class="muted"></p>
  </main>
  <script src="/open.js"></script>
</body>
</html>

<html lang="en">

  <link rel="icon" type="image/png" href="/favicon.jpg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

    <img id="player-cover" alt="" hidden>
    <div id="player-info"></div>
    <audio id="audio" controls preload="none"></audio>
  </footer>
  <script src="/share.js"></script>
</body>

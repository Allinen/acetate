[extension]
name = "youtube"
title = "YouTube"
api = 3

[[shape]]
kind = "track"
id = "song_id"
fields = [
  { name = "song_id", type = "str", required = true },
  { name = "song_description", type = "str" },
  { name = "song_release_date", type = "str" },
]

[[shape]]
kind = "artist"
id = "channel"
fields = [
  { name = "channel", type = "str", required = true },
]

# An id on its own (or ending a yt-dlp file name, `Title [id].ext`) is a video: any 11 of
# A-Z a-z 0-9 - _ (so "helloworld1" is one, on purpose).
[id]
kind = "track"
field = "song_id"
class = "id"
len = 11
filename = true
bare = true

[[link]]
kind = "track"
open = "https://www.youtube.com/watch?v={song_id}"
match = [
  "https://youtube.com/watch?v={song_id}",
  "https://music.youtube.com/watch?v={song_id}",
  "https://youtu.be/{song_id}",
  "https://youtube.com/shorts/{song_id}",
  "https://youtube.com/embed/{song_id}",
  "https://youtube.com/live/{song_id}",
  "https://youtube.com/v/{song_id}",
]
captures = { song_id = { class = "id", len = 11 } }

[[link]]
kind = "artist"
open = "https://www.youtube.com/channel/{channel}"
match = ["https://youtube.com/@{channel}", "https://youtube.com/channel/{channel}"]

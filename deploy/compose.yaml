# Acetate in Docker: Postgres and Acetate. Copy this folder to the machine that runs it,
# copy .env.example to .env and fill it in, then `docker compose up -d`.
#
# CLI commands run inside the container, e.g.:
#   docker compose exec acetate acetate user create admin --group admin
#   docker compose exec acetate acetate ingest /disk/Music/ --layout tags --source generic --dry-run

services:
  postgres:
    container_name: acetate-postgres
    image: postgres:18
    restart: unless-stopped
    user: "${ACETATE_UID:-1000}:${ACETATE_GID:-1000}"
    environment:
      POSTGRES_USER: acetate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: acetate
    volumes:
      # The database: the library itself. Back it up (pg_dump) with the volumes below.
      - ${POSTGRES_DATA:?set POSTGRES_DATA in .env}:/var/lib/postgresql
    # Not published: only Acetate talks to it. For psql: docker compose exec postgres psql -U acetate
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acetate -d acetate"]
      interval: 5s
      timeout: 5s
      retries: 20

  acetate:
    container_name: acetate
    image: ${ACETATE_IMAGE:-acetate:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Who owns the files it writes on the disk(s) below.
    user: "${ACETATE_UID:-1000}:${ACETATE_GID:-1000}"
    environment:
      DATABASE_URL: postgres://acetate:${POSTGRES_PASSWORD}@postgres:5432/acetate
      # Where blobs go (see the README, "File storage"): names → paths inside the
      # container. The first is the default.
      ACETATE_VOLUMES: ${ACETATE_VOLUMES:?set ACETATE_VOLUMES in .env}
      ACETATE_SECURE_COOKIES: ${ACETATE_SECURE_COOKIES:-false}
      ACETATE_TRUST_PROXY: ${ACETATE_TRUST_PROXY:-false}
    ports:
      - "${ACETATE_PORT:-3000}:3000"
    volumes:
      # Host folders for Acetate's files and for music to import. Tip: if the music and
      # Acetate's volume are under the same mount, imports can be reflinks (instant, no
      # extra space) on filesystems that support them (btrfs, XFS, ZFS with block cloning);
      # that only works within a single mount, even if two mounts are the same disk.
      - ${DISK:?set DISK in .env}:/disk
      # A second disk for another volume (see ACETATE_VOLUMES in .env): uncomment, and set
      # DISK2 in .env.
      # - ${DISK2:?set DISK2 in .env}:/disk2

# Acetate on a server: Postgres and Acetate. Copy this folder there, copy
# .env.example to .env and fill it in, then `docker compose up -d`.
#
# CLI commands run inside the container, e.g.:
#   docker compose exec acetate acetate user create admin --group admin
#   docker compose exec acetate acetate ingest /pool/Music/ --layout tags --source generic --dry-run

services:
  postgres:
    container_name: acetate-postgres
    image: postgres:18
    restart: unless-stopped
    user: "${ACETATE_UID:-1000}:${ACETATE_GID:-1000}"
    environment:
      POSTGRES_USER: acetate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: acetate
    volumes:
      # The database: the library itself. Back it up (pg_dump) with the volumes below.
      - ${POSTGRES_DATA:?set POSTGRES_DATA in .env}:/var/lib/postgresql
    # Not published: only Acetate talks to it. For psql: docker compose exec postgres psql -U acetate
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acetate -d acetate"]
      interval: 5s
      timeout: 5s
      retries: 20

  acetate:
    container_name: acetate
    image: ${ACETATE_IMAGE:-localhost:5000/acetate:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Who owns the files it writes on the disks below.
    user: "${ACETATE_UID:-1000}:${ACETATE_GID:-1000}"
    environment:
      DATABASE_URL: postgres://acetate:${POSTGRES_PASSWORD}@postgres:5432/acetate
      # Where blobs go (see the README, "File storage"): names → paths inside the
      # container. The first is the default.
      ACETATE_VOLUMES: ${ACETATE_VOLUMES:?set ACETATE_VOLUMES in .env}
      ACETATE_SECURE_COOKIES: ${ACETATE_SECURE_COOKIES:-false}
      ACETATE_TRUST_PROXY: ${ACETATE_TRUST_PROXY:-false}
    ports:
      - "${ACETATE_PORT:-3000}:3000"
    volumes:
      # One mount per disk, holding both the music to import and Acetate's volume on that
      # disk: a reflink (instant, no extra space) only works within a single mount, even
      # if two mounts are the same disk.
      - ${FAST_DISK:?set FAST_DISK in .env}:/pool
      - ${SLOW_DISK:?set SLOW_DISK in .env}:/hdd

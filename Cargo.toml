[workspace]
members = [".", "crates/acetate-extensions"]

[package]
name = "acetate"
version = "0.3.0"
edition = "2024"

[dependencies]
acetate-extensions = { path = "crates/acetate-extensions" }
aes-gcm = "0.11.1"
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
globset = "0.4.20"
hex = "0.4.3"
id3 = "1.17.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
imagesize = "0.15.0"
lofty = "0.25.4"
mime = "0.3.17"
rand = "0.10.3"
reflink-copy = "0.1.30"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "query", "rustls", "stream"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "sqlite", "uuid", "chrono", "json", "migrate", "macros"] }
symphonia = { version = "0.6.1", features = ["all"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "limit", "fs", "compression-gzip", "compression-zstd"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v7", "serde"] }

# Password hashing is deliberately slow; unoptimized (debug builds) it's many times slower
# still, making logins sluggish during development. Optimize just those crates.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Cover images are decoded and scaled on first request (`storage::images`): unoptimized,
# that's many times slower. Same trick as for password hashing.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

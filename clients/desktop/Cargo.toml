[package]
name = "acetate-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
acetate-core = { path = "../core" }
anyhow = "1.0.104"
arboard = { version = "3.6", features = ["wayland-data-control"] }
dirs = "7.0.0"
eframe = "0.36.2"
egui_extras = "0.36.2"
fs4 = "1.1.0"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
libloading = "0.9.0"
reflink-copy = "0.1.30"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "zstd", "gzip", "multipart"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-all", "symphonia-simd"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustfft = "6.4.1"
rusty-opus = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.11.0"
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
symphonia = { version = "0.5.5", default-features = false, features = ["ogg", "mkv"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }

[build-dependencies]
winresource = "0.1.31"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
winit = { version = "0.30", default-features = false, features = ["x11"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"

[dev-dependencies]
acetate-core = { path = "../core", features = ["test-support"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

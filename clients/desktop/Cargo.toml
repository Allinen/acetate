[package]
name = "acetate-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6", features = ["wayland-data-control"] }
dirs = "7.0.0"
eframe = "0.36.2"
egui_extras = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
nucleo-matcher = "0.3.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "zstd", "gzip", "multipart"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-all", "symphonia-simd"] }
rustfft = "6.4.1"
rusty-opus = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
symphonia = { version = "0.5.5", default-features = false, features = ["ogg", "mkv"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time"] }
uuid = { version = "1.26.1", features = ["serde"] }

[profile.release]
opt-level = 3

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

[package]
name = "acetate-ffi"
version = "0.3.1"
edition = "2024"

[lib]
name = "acetate_ffi"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
acetate-core = { path = "../../core" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time"] }
uniffi = { version = "0.32.2", features = ["tokio", "cli"] }
uuid = "1.26.1"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", default-features = false }
rustls-platform-verifier = "0.7"
android_logger = "0.15"

[dev-dependencies]
acetate-core = { path = "../../core", features = ["test-support"] }
tempfile = "3.27.0"
serde_json = "1.0.151"

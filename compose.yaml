services:
  postgres:
    image: postgres:18
    # Start again after a reboot (as long as Docker itself starts at boot).
    restart: unless-stopped
    environment:
      POSTGRES_USER: acetate
      POSTGRES_PASSWORD: acetate
      POSTGRES_DB: acetate
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:

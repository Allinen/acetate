[book]
title = "Acetate"
language = "en"
src = "."

[build]
# Outside src: the book is generated, and inside src `mdbook serve` sees its own output
# change and rebuilds forever.
build-dir = "../target/book"

[output.html]
# The command graphs (docs/commands.md) are mermaid: drawn by mermaid.min.js, which the
# mdbook-mermaid preprocessor installed here (`mdbook-mermaid install docs`).
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[preprocessor.mermaid]
command = "mdbook-mermaid"
